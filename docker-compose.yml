services:
  postgres:
    image: postgres:16-alpine
    container_name: mall-distribution-db
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      POSTGRES_DB: mall_distribution
    ports:
      - "5433:5432"
    volumes:
      - mall-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall -d mall_distribution"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mall-pgdata:
